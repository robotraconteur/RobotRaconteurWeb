name: CI

on:
  push:
  pull_request:
  release:
    types:
    - created

  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet 8.x
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.x
    - name: Install dependencies
      run: dotnet restore
    - name: Run
      run: dotnet run --project test/RobotRaconteur.Sharp.Test/RobotRaconteur.Sharp.Test.csproj --configuration Release
      shell: cmd
    - name: Build nuget packages
      run: |
        dotnet pack  "RobotRaconteur.Sharp/RobotRaconteur.Sharp.csproj" -p:Platform="AnyCPU" --configuration Release
        dotnet pack  "RobotRaconteur.Sharp.Gen/RobotRaconteur.Sharp.Gen.csproj" -p:Platform="AnyCPU" --configuration Release
    - name: Upload nuget packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: |
          ./**/*.nupkg
  ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Checkout Robot Raconteur Core test vectors
      uses: actions/checkout@v7
      with:
        repository: robotraconteur/robotraconteur
        ref: master
        path: rr-core
        sparse-checkout: test/data
    - name: Check test vectors against Core
      run: python3 .github/scripts/check_test_vectors.py test/RobotRaconteur.Sharp.Test/test_vectors.bin rr-core/test/data
    - name: Setup dotnet 8.x
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.x
    - name: Build and Run
      run: dotnet run --project test/RobotRaconteur.Sharp.Test/RobotRaconteur.Sharp.Test.csproj --configuration Release
  blazor:
    runs-on: ubuntu-latest
    # Must match the @playwright/test version in test/RobotRaconteur.Sharp.BlazorTest/e2e/package.json
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet 8.x
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.x
    - name: Publish Blazor test app and test server
      run: |
        dotnet publish test/RobotRaconteur.Sharp.BlazorTest/RobotRaconteur.Sharp.BlazorTest.csproj -c Release -o test/RobotRaconteur.Sharp.BlazorTest/bin/publish-app
        dotnet publish test/RobotRaconteur.Sharp.Test/RobotRaconteur.Sharp.Test.csproj -c Release -r linux-x64 --self-contained -o test/RobotRaconteur.Sharp.BlazorTest/bin/publish-server
    - name: Run Playwright tests
      working-directory: test/RobotRaconteur.Sharp.BlazorTest/e2e
      env:
        HOME: /root
      run: |
        npm ci
        npx playwright test
    - name: Upload Playwright traces
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-traces
        path: test/RobotRaconteur.Sharp.BlazorTest/e2e/test-results/
  pre-commit:
    runs-on: ubuntu-latest
    env:
      SKIP: no-commit-to-branch
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - name: apt
      run: |
        sudo apt update
        sudo apt install -y dos2unix
    - name: Setup dotnet 8.x
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.x
    - name: Update dotnet format
      run: dotnet tool update -g dotnet-format
    - name: Restore solution for dotnet format
      run: dotnet restore RobotRaconteur.Sharp.sln
    - uses: pre-commit/action@v3.0.1
