name: docs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet 8.x
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.x
    - name: Install docfx
      run: dotnet tool install --global docfx --version 2.81.0
    - name: Copy readme files to docs
      run: |
        cp RobotRaconteur.Sharp/README.md docs/netcore/articles/robotraconteursharp_readme.md
        cp RobotRaconteur.Sharp.Gen/README.md docs/netcore/articles/robotraconteursharpgen_readme.md
    - name: Build docs
      working-directory: docs/netcore
      run: docfx docfx.json
    - name: Assemble site
      run: |
        mkdir -p site/doc/latest
        mv docs/netcore/_site site/doc/latest/netcore
        cp docs/github_pages/index.html site/index.html
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: site

  deploy:
    needs: build
    # Permissions required to make a Pages deployment
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
